<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXPREXA ATTENDANCE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D;
    --ink-2:#1D2E52;
    --paper:#EEF1F6;
    --card:#FFFFFF;
    --amber:#F2A93B;
    --amber-dark:#C97F12;
    --green:#1F9D6B;
    --red:#D64545;
    --text:#1B2333;
    --muted:#67708A;
    --line:#DCE1EA;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  /* ===== App shell ===== */
  .app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
  }
  .topbar{
    background:var(--ink);
    color:#fff;
    padding:18px 20px 16px;
    position:relative;
    overflow:hidden;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    position:relative;
    z-index:1;
  }
  .brand .name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.01em;
  }
  .brand .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--amber);
    letter-spacing:0.08em;
    text-transform:uppercase;
    border:1px solid rgba(242,169,59,0.5);
    padding:2px 6px;
    border-radius:4px;
  }
  .subline{
    font-size:12.5px;
    color:#B9C2DA;
    margin-top:6px;
    position:relative;
    z-index:1;
  }

  .tabs{
    display:flex;
    background:var(--ink-2);
    position:relative;
    z-index:1;
  }
  .tab{
    flex:1;
    padding:11px 8px;
    text-align:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:13px;
    color:#A9B3CE;
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition:color .15s, border-color .15s;
    user-select:none;
  }
  .tab.active{
    color:#fff;
    border-bottom-color:var(--amber);
  }

  .content{
    flex:1;
    padding:22px 18px 60px;
  }
  .view{display:none;}
  .view.active{display:block;}

  /* ===== Kiosk / QR ticket ===== */
  .ticket{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(20,33,61,0.06), 0 8px 24px rgba(20,33,61,0.08);
    padding:0;
    overflow:hidden;
    margin-bottom:18px;
  }
  .ticket-head{
    background:var(--ink);
    color:#fff;
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .ticket-head .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--amber);
  }
  .ticket-head .date{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:14px;
  }
  .ticket-body{
    padding:28px 20px 18px;
    text-align:center;
  }
  #qr-box{
    display:inline-block;
    padding:14px;
    background:#fff;
    border:2px solid var(--ink);
    border-radius:10px;
  }
  #qr-box img, #qr-box canvas{
    display:block;
    border-radius:2px;
  }
  .token-row{
    margin-top:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .token-row .code{
    font-family:'IBM Plex Mono',monospace;
    font-size:19px;
    font-weight:600;
    letter-spacing:0.14em;
    background:var(--paper);
    border:1px dashed var(--line);
    padding:6px 14px;
    border-radius:8px;
  }
  .perf{
    height:0;
    border-top:2px dashed var(--line);
    margin:0 18px;
    position:relative;
  }
  .perf::before, .perf::after{
    content:"";
    position:absolute;
    top:-9px;
    width:18px; height:18px;
    background:var(--paper);
    border-radius:50%;
  }
  .perf::before{left:-27px;}
  .perf::after{right:-27px;}
  .ticket-foot{
    padding:14px 20px 18px;
    text-align:center;
  }
  .ticket-foot .hint{
    font-size:12.5px;
    color:var(--muted);
    line-height:1.5;
  }
  .ticket-foot a.linkbtn{
    display:inline-block;
    margin-top:10px;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--ink);
  }

  .cal-grid{display:grid; grid-template-columns:repeat(7,minmax(40px,1fr)); gap:4px;}
  .cal-head{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--muted); text-align:center; padding:4px 0;}
  .cal-cell{background:var(--card); border:1px solid var(--line); border-radius:8px; min-height:52px;
    padding:6px; cursor:pointer; overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .cal-cell:hover{border-color:var(--ink);}
  .cal-cell.muted{background:var(--paper); opacity:.55; cursor:default;}
  .cal-cell.today{border-color:var(--amber); border-width:2px;}
  .cal-cell.holiday{background:rgba(214,69,69,0.08); border-color:rgba(214,69,69,0.35);}
  .cal-cell.holiday .cal-date{color:var(--red);}
  .cal-date{font-size:14px; font-weight:700; color:var(--ink);}
  .cal-chip{font-size:10px; line-height:1.35; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; color:var(--ink);}
  .cal-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .status-strip{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }
  .stat{
    flex:1;
    background:var(--card);
    border-radius:10px;
    padding:12px 14px;
    border:1px solid var(--line);
  }
  .stat .n{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
  }
  .stat .l{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-top:2px;
  }

  /* ===== Forms ===== */
  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .field input{
    width:100%;
    padding:11px 13px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    background:#fff;
    color:var(--text);
  }
  .field input:focus{
    outline:2px solid var(--amber);
    outline-offset:1px;
    border-color:var(--amber);
  }
  .row2{
    display:flex;
    gap:12px;
  }
  .row2 .field{flex:1;}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:12px 20px;
    border-radius:9px;
    border:none;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    transition:transform .08s, opacity .15s;
    width:100%;
  }
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-amber{background:var(--amber); color:var(--ink);}
  .btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
  .btn-sm{width:auto; padding:8px 14px; font-size:13px;}

  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:20px;
    border:1px solid var(--line);
    margin-bottom:16px;
  }
  .card h3{
    margin:0 0 14px;
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--amber-dark);
    margin-bottom:6px;
  }
  .help{
    font-size:12.5px;
    color:var(--muted);
    line-height:1.5;
    margin-top:-4px;
    margin-bottom:14px;
  }

  /* ===== Log table ===== */
  .log-controls{
    display:flex;
    gap:10px;
    margin-bottom:14px;
    align-items:center;
  }
  select{
    padding:9px 12px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    flex:1;
  }
  .logtable{
    width:100%;
    border-collapse:collapse;
    background:var(--card);
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .logtable th{
    background:var(--ink);
    color:#fff;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:9px 10px;
    text-align:left;
  }
  .logtable td{
    padding:9px 10px;
    font-size:12.5px;
    border-top:1px solid var(--line);
  }
  .logtable tr:nth-child(even) td{background:#F7F9FC;}
  .pill{
    display:inline-block;
    padding:2px 8px;
    border-radius:20px;
    font-size:10.5px;
    font-weight:700;
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
  }
  .pill-in{background:rgba(31,157,107,0.14); color:var(--green);}
  .pill-out{background:rgba(214,69,69,0.12); color:var(--red);}

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--muted);
    font-size:13.5px;
  }

  /* ===== Worker view ===== */
  .worker-shell{
    max-width:420px;
    margin:0 auto;
    padding:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .worker-hero{
    background:var(--ink);
    color:#fff;
    padding:34px 24px 26px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .worker-hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:6px;
    background:repeating-linear-gradient(
      -45deg,
      var(--amber) 0 10px,
      var(--ink-2) 10px 20px
    );
  }
  .worker-hero .company{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:19px;
  }
  .worker-hero .day{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--amber);
    margin-top:6px;
    letter-spacing:0.06em;
  }
  .worker-body{
    flex:1;
    padding:26px 22px 40px;
  }
  .locate-state{
    text-align:center;
    padding:30px 10px;
  }
  .pulse{
    width:52px;height:52px;
    border-radius:50%;
    border:3px solid var(--amber);
    border-top-color:transparent;
    margin:0 auto 16px;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .distance-badge{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:5px 12px;
    border-radius:20px;
    margin-top:10px;
  }
  .distance-ok{background:rgba(31,157,107,0.14); color:var(--green);}
  .distance-bad{background:rgba(214,69,69,0.12); color:var(--red);}

  .confirm{
    text-align:center;
    padding:30px 10px;
  }
  .confirm .mark{
    width:64px;height:64px;
    border-radius:50%;
    background:var(--green);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 16px;
    font-size:30px;
  }
  .confirm .mark.out{background:var(--red);}
  .confirm h2{
    font-family:'Space Grotesk',sans-serif;
    margin:0 0 4px;
  }
  .confirm .ts{
    font-family:'IBM Plex Mono',monospace;
    color:var(--muted);
    font-size:13px;
  }

  .toggle-group{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }
  .toggle-opt{
    flex:1;
    text-align:center;
    padding:14px 8px;
    border-radius:10px;
    border:2px solid var(--line);
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    color:var(--muted);
    background:#fff;
  }
  .toggle-opt.selected.in{border-color:var(--green); color:var(--green); background:rgba(31,157,107,0.06);}
  .toggle-opt.selected.out{border-color:var(--red); color:var(--red); background:rgba(214,69,69,0.06);}

  .banner{
    padding:12px 14px;
    border-radius:9px;
    font-size:13px;
    margin-bottom:16px;
    line-height:1.5;
  }
  .banner-warn{background:#FFF4E0; color:#8A5A00; border:1px solid #F3D48A;}
  .banner-err{background:#FCEBEB; color:#A32B2B; border:1px solid #F0B8B8;}

  footer.note{
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    padding:18px 20px 30px;
  }

  @media (prefers-reduced-motion: reduce){
    .pulse{animation:none;}
  }
</style>
</head>
<body>

<div id="root"></div>

<script>
(function(){

  // ---------- Utilities ----------
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function todayStr(d){
    d = d || new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  // The "shift day" changes over at 6:00 AM instead of midnight — a scan at
  // 2am still counts as the previous day's shift/QR code.
  function shiftDateStr(d){
    d = d || new Date();
    const shifted = new Date(d.getTime() - 6*60*60*1000);
    return todayStr(shifted);
  }
  // Reads up to two clock-in/out locations from config, falling back to the
  // older single-location fields so previously saved setups keep working.
  function getLocations(cfg){
    const locs = [];
    if(cfg.loc1Lat !== undefined && cfg.loc1Lat !== null && !isNaN(cfg.loc1Lat)){
      locs.push({ name: cfg.loc1Name || 'Clock-in point', lat: cfg.loc1Lat, lng: cfg.loc1Lng, radiusM: cfg.loc1Radius || 100 });
    } else if(cfg.lat !== undefined && cfg.lat !== null && !isNaN(cfg.lat)){
      locs.push({ name: cfg.companyName || 'Clock-in point', lat: cfg.lat, lng: cfg.lng, radiusM: cfg.radiusM || 100 });
    }
    if(cfg.loc2Lat !== undefined && cfg.loc2Lat !== null && !isNaN(cfg.loc2Lat)){
      locs.push({ name: cfg.loc2Name || 'Location 2', lat: cfg.loc2Lat, lng: cfg.loc2Lng, radiusM: cfg.loc2Radius || 100 });
    }
    if(cfg.loc3Lat !== undefined && cfg.loc3Lat !== null && !isNaN(cfg.loc3Lat)){
      locs.push({ name: cfg.loc3Name || 'Location 3', lat: cfg.loc3Lat, lng: cfg.loc3Lng, radiusM: cfg.loc3Radius || 100 });
    }
    return locs;
  }
  function fmtTime(d){
    let h = d.getHours(), m = pad(d.getMinutes());
    let ap = h>=12?'PM':'AM';
    h = h%12; if(h===0) h=12;
    return h+':'+m+' '+ap;
  }
  function fmtDateHuman(d){
    return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric', year:'numeric'});
  }
  // simple deterministic string hash -> base36
  function hashCode(str){
    let hash = 5381;
    for(let i=0;i<str.length;i++){
      hash = ((hash << 5) + hash + str.charCodeAt(i)) >>> 0;
    }
    return hash.toString(36).toUpperCase();
  }
  function dailyToken(secret, dateStr){
    return hashCode(secret + '::' + dateStr).slice(0,6).padStart(6,'0');
  }
  function permanentToken(secret){
    return hashCode(secret + '::PERMANENT').slice(0,6).padStart(6,'0');
  }
  function haversine(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const toRad = x => x * Math.PI/180;
    const dLat = toRad(lat2-lat1);
    const dLon = toRad(lon2-lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R*c;
  }
  function uid(){
    return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function baseUrl(){
    return window.location.href.split('#')[0];
  }
  function parseHash(){
    const h = window.location.hash.replace(/^#/, '');
    const parts = h.split('&');
    const out = {mode: parts[0] || ''};
    parts.slice(1).forEach(p=>{
      const [k,v] = p.split('=');
      out[k] = decodeURIComponent(v||'');
    });
    return out;
  }

  // ---------- Firebase setup ----------
  // Paste your own project's config here (Firebase console → Project settings →
  // Your apps → SDK setup and configuration). This is what makes the app share
  // data across every device instead of each phone having its own private copy.
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCDzNm4W1D9NVp9l60JEiZOSCaCQNnyr3c",
    authDomain: "dispatch-clock.firebaseapp.com",
    projectId: "dispatch-clock",
    storageBucket: "dispatch-clock.firebasestorage.app",
    messagingSenderId: "562921093074",
    appId: "1:562921093074:web:efe0e6393a83014c3d3a0b"
  };
  const FIREBASE_READY = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('PASTE_') !== 0);
  let db = null;
  if(FIREBASE_READY){
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  }

  // Compress a photo file down before storing (keeps each record small — no
  // paid Cloud Storage needed, the photo just lives inside the log entry itself)
  function compressImage(file, maxW, quality){
    maxW = maxW || 360;
    quality = quality || 0.55;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('compress failed')), 'image/jpeg', quality);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function blobToDataUrl(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // A per-browser ID (not per-person) — used only to flag when the same phone
  // is used to clock in/out under more than one name in the same day.
  function getDeviceId(){
    let id = localStorage.getItem('epx_device_id');
    if(!id){
      id = (crypto.randomUUID ? crypto.randomUUID() : uid());
      localStorage.setItem('epx_device_id', id);
    }
    return id;
  }

  // ---------- Storage helpers (Firestore-backed, shared across all devices) ----------
  async function getConfig(){
    if(!db) return null;
    try{
      const doc = await db.collection('epx_config').doc('main').get();
      return doc.exists ? doc.data() : null;
    }catch(e){ console.error('getConfig failed:', e); return null; }
  }
  async function setConfig(cfg){
    if(!db) return false;
    try{
      await db.collection('epx_config').doc('main').set(cfg);
      return true;
    }catch(e){ console.error('setConfig failed:', e); return false; }
  }
  // Counts for one day only. The admin home screen just needs today's in/out
  // tallies — reading the entire log (every entry ever, each with a selfie)
  // to filter it down to one day was by far the heaviest read in the app.
  async function getLogCountsForDate(dateStr){
    try{
      const snap = await db.collection('epx_log').where('date', '==', dateStr).get();
      let inC = 0, outC = 0;
      snap.docs.forEach(d=>{ const e = d.data(); if(e.type === 'in') inC++; else if(e.type === 'out') outC++; });
      return { in: inC, out: outC };
    }catch(e){
      console.error('Could not load today\'s counts:', e);
      return { in: 0, out: 0 };
    }
  }
  // Full history. Only payroll/report screens genuinely need every entry —
  // everything else should use getRecentLog() or getLogCountsForDate().
  async function getLog(){
    if(!db) return [];
    try{
      const snap = await db.collection('epx_log').orderBy('ts').get();
      return snap.docs.map(d => d.data());
    }catch(e){ console.error('getLog failed:', e); return []; }
  }

  // ---------- Password hashing ----------
  // NOTE: this is a lightweight access gate, not bank-grade security — there's
  // no real backend server here, so the hash is compared client-side against
  // data stored in Firestore. Good enough to stop casual misuse (wrong phone,
  // wrong person guessing a name); not a substitute for real authentication
  // if this ever needs to resist a determined attacker.
  async function sha256Hex(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  // A standard working day is 8h30. Used to auto-fill shift end times and to
  // flag days that came up short — deliberately NOT used to decide pay, which
  // still keys off the existing 'Complete' status.
  const STANDARD_SHIFT_MINUTES = 8*60 + 30;
  function addMinutesToTime(hhmm, mins){
    const [h, m] = hhmm.split(':').map(Number);
    const total = (h*60 + m + mins) % (24*60);
    return String(Math.floor(total/60)).padStart(2,'0') + ':' + String(total%60).padStart(2,'0');
  }

  const FIXED_MY_HOLIDAYS = [
    { md:'01-01', name:"New Year's Day" },

  // Monday of the week containing dateStr. Noon UTC avoids any DST edge cases.
  function mondayOf(dateStr){
    const d = new Date(dateStr + 'T12:00:00Z');
    const dow = d.getUTCDay();               // 0=Sun ... 6=Sat
    d.setUTCDate(d.getUTCDate() - (dow === 0 ? 6 : dow - 1));
    return d.toISOString().slice(0,10);
  }
  function weeksBetween(fromMonday, toMonday){
    const a = new Date(fromMonday + 'T12:00:00Z').getTime();
    const b = new Date(toMonday + 'T12:00:00Z').getTime();
    return Math.round((b - a) / (7*24*60*60*1000));
  }
  // The shift a worker is on for the week containing dateStr.
  //
  // Order of precedence:
  //   1. A manual override for that worker and week always wins.
  //   2. If they're paired with someone, the two swap shifts on odd weeks.
  //   3. Otherwise they stay on their own shift indefinitely.
  // Nothing is stored per week unless it's been manually changed.
  // Overrides are per DATE, so a single day can be changed without touching
  // the rest of the week.
  function overrideKey(workerId, dateStr){ return workerId + '|' + dateStr; }

  // Which group a worker is in for the week containing dateStr. Partners swap
  // groups as well as shifts, so the pair alternate between A and B.
  function groupForWorkerOn(worker, dateStr, cfg){
    const base = worker.rosterGroup === 'B' ? 'B' : 'A';
    if(!worker.partnerId) return base;
    const wk = weeksBetween(cfg.anchorMonday, mondayOf(dateStr));
    const swap = (((wk % 2) + 2) % 2) === 1;
    return swap ? (base === 'A' ? 'B' : 'A') : base;
  }
  // Group A rests on Saturday, Group B on Sunday.
  function isOffDayFor(group, dateStr){
    const dow = new Date(dateStr + 'T12:00:00Z').getUTCDay(); // 0=Sun ... 6=Sat
    return (group === 'A' && dow === 6) || (group === 'B' && dow === 0);
  }
  const OFF_SHIFT = { id:'OFF', code:'OFF', name:'Off', start:'', end:'' };
  function shiftForWorkerOn(worker, dateStr, cfg, shifts, workers, overrides){
    if(shifts.length === 0) return null;
    // A manual change for that exact date always wins — including putting
    // someone on shift during what would normally be their rest day.
    const ov = overrides ? overrides[overrideKey(worker.id, dateStr)] : null;
    if(ov){
      if(ov === 'OFF') return OFF_SHIFT;
      const found = shifts.find(s=>s.id === ov);
      if(found) return found;
    }
    const grp = groupForWorkerOn(worker, dateStr, cfg);
    if(isOffDayFor(grp, dateStr)) return OFF_SHIFT;
    if(!worker.rosterShiftId) return null;
    const own = shifts.find(s=>s.id === worker.rosterShiftId) || null;
    if(!worker.partnerId) return own;               // no partner, no rotation
    const partner = (workers||[]).find(w=>w.id === worker.partnerId);
    if(!partner || !partner.rosterShiftId) return own;
    const wk = weeksBetween(cfg.anchorMonday, mondayOf(dateStr));
    const swap = (((wk % 2) + 2) % 2) === 1;        // correct for dates before the anchor
    if(!swap) return own;
    return shifts.find(s=>s.id === partner.rosterShiftId) || own;
  }

  // ---------- Payment Vouchers (PV) ----------
  // Running PV numbers are assigned via a Firestore transaction so two admins
  // generating a PV at the same moment can never get the same number.
  async function getNextPvNumber(){
    if(!db) return null;
    try{
      const counterRef = db.collection('epx_meta').doc('pvCounter');
      const next = await db.runTransaction(async (tx) => {
        const doc = await tx.get(counterRef);
        const current = doc.exists ? (doc.data().value || 0) : 0;
        const n = current + 1;
        tx.set(counterRef, { value: n });
        return n;
      });
      return 'PV-' + String(next).padStart(6, '0');
    }catch(e){ console.error('getNextPvNumber failed:', e); return null; }
  }

    catch(e){ console.error('savePv failed:', e); return false; }
  }
  // Vouchers, newest first. Bounded by default — pass a large limit (or
  // Infinity) only where the complete set genuinely matters.
  const PV_RECENT_LIMIT = 200;
  async function getPvRecords(limitN){
    if(!db) return [];
    const n = limitN || PV_RECENT_LIMIT;
    try{

  // ---------- Outsource requests ----------
  // A worker's own submissions — queried by worker rather than filtering a
  // global window, so a less active worker's records never fall off the end.
  async function getOutsourceForWorker(workerId){
    if(!db) return [];
    try{
      const snap = await db.collection('epx_outsource').where('workerId','==',workerId).get();
      return snap.docs.map(d => d.data())
        .sort((a,b)=> String(b && b.submittedAt || '').localeCompare(String(a && a.submittedAt || '')));
    }catch(e){ console.error('getOutsourceForWorker failed:', e); return []; }
  }
  // A worker's clock in/out for one day. Fetched on demand per row rather
  // than in bulk: clock entries carry selfie photos, so loading them for every
  // outsource request on screen would be far heavier than the log itself.
  // How much a worker record has actually been used. Lets you tell which of
  // two same-named records is the live one before deleting either.
  async function getWorkerActivity(workerId){
    if(!db) return null;
    try{
      const [clockSnap, outSnap] = await Promise.all([
        db.collection('epx_log').where('workerId','==',workerId).get(),
        db.collection('epx_outsource').where('workerId','==',workerId).get()
      ]);
      const clockRows = clockSnap.docs.map(d=>d.data());
      const lastClock = clockRows.map(r=>r.date).sort().reverse()[0] || null;
      return { clocks: clockRows.length, outsource: outSnap.size, lastClock };
    }catch(e){ console.error('getWorkerActivity failed:', e); return null; }
  }
  async function getClockTimesFor(workerId, dateStr){
    if(!db) return null;
    try{
      const snap = await db.collection('epx_log')
        .where('workerId', '==', workerId).where('date', '==', dateStr).get();
      const rows = snap.docs.map(d=>d.data()).sort((a,b)=> String(a.ts||'').localeCompare(String(b.ts||'')));
      const ins = rows.filter(r=>r.type === 'in');
      const outs = rows.filter(r=>r.type === 'out');
      const fmt = r => new Date(r.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      return {
        inTime: ins.length ? fmt(ins[0]) : null,
        outTime: outs.length ? fmt(outs[outs.length-1]) : null,
        count: rows.length
      };
    }catch(e){ console.error('getClockTimesFor failed:', e); return null; }
  }
  const OUTSOURCE_RECENT_LIMIT = 300;
  async function getOutsourceRequests(limitN){
    if(!db) return [];
    const n = limitN === undefined ? OUTSOURCE_RECENT_LIMIT : limitN;
    try{
      let q = db.collection('epx_outsource').orderBy('submittedAt', 'desc');
      if(isFinite(n)) q = q.limit(n);
      const snap = await q.get();
      // Firestore orders these now, but keep the defensive sort: a record
      // missing submittedAt is excluded from an orderBy query, so fall back
      // to an unordered read if the ordered one comes back empty.
      const rows = snap.docs.map(d => d.data());
      if(rows.length === 0){
        const all = await db.collection('epx_outsource').get();
        return all.docs.map(d => d.data())
          .sort((a,b)=> String(b && b.submittedAt || '').localeCompare(String(a && a.submittedAt || '')));
      }
      return rows;
    }catch(e){ console.error('getOutsourceRequests failed:', e); return []; }
  }

    async function renderOutsourceForm(worker){
      // Workers restricted to clock in/out can't file outsource requests.
      if(worker.accessMode === 'clock'){
        body.innerHTML = `
          <div class="field">
            <label>Logged in as</label>
            <div style="padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;color:var(--ink);background:#F7F8FB;">${escapeHtml(worker.name)}</div>
          </div>
          <div class="empty" style="margin-top:14px;">Outsource requests aren't enabled for your account — please clock in and out on site as usual.<br><br>Speak to your admin if you think this is wrong.</div>
          <a class="btn btn-ghost" href="${baseUrl()}" style="margin-top:14px;display:block;text-align:center;text-decoration:none;">Go to clock in/out</a>
        `;
        return;
      }
      body.innerHTML = `
        <div class="field">
          <label>Logged in as</label>
          <div style="padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;color:var(--ink);background:#F7F8FB;">${escapeHtml(worker.name)}</div>
        </div>
        <div class="field"><label>Date</label><input type="date" id="os-date"></div>
        <div class="field"><label>Start time</label><input type="time" id="os-start"></div>
        <div class="field"><label>End time</label><input type="time" id="os-end"></div>
        <div class="field">
          <label>Reason for outsource</label>
          <textarea id="os-reason" rows="4" style="width:100%;font-family:'Inter',sans-serif;font-size:14px;padding:12px;border-radius:10px;border:1.5px solid var(--line);resize:vertical;box-sizing:border-box;" placeholder="e.g. Covered an extra delivery run for Site B"></textarea>
        </div>
        <button class="btn btn-primary" id="os-submit">Submit for Approval</button>
        <div id="os-msg" style="margin-top:10px;font-size:13px;"></div>
        <div style="margin-top:24px;">
          <div style="font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px;">My Submissions</div>
          <div id="os-mine">Loading…</div>
        </div>
      `;
      document.getElementById('os-date').value = shiftDateStr();
      renderMySubmissions(worker).then(html => { document.getElementById('os-mine').innerHTML = html; });
      document.getElementById('os-submit').onclick = async function(){
        const date = document.getElementById('os-date').value;
        const start = document.getElementById('os-start').value;
        const end = document.getElementById('os-end').value;
        const reason = document.getElementById('os-reason').value.trim();
        const msg = document.getElementById('os-msg');
        if(!date || !start || !end){ msg.style.color='var(--red)'; msg.textContent='Date, start time, and end time are all required.'; return; }
        if(!reason){ msg.style.color='var(--red)'; msg.textContent='Please give a reason for the outsource work.'; return; }
        const [sh,sm] = start.split(':').map(Number);
        const [eh,em] = end.split(':').map(Number);
        const startMin = sh*60+sm;
        let endMin = eh*60+em;
        if(endMin === startMin){ msg.style.color='var(--red)'; msg.textContent='End time must be different from start time.'; return; }
        // If end time is earlier than start time, treat it as crossing
        // midnight into the next day (e.g. 5:00 PM -> 8:00 AM).
        if(endMin < startMin) endMin += 24*60;
        const hours = Math.round(((endMin-startMin)/60)*100)/100;

        this.disabled = true; this.textContent = 'Submitting…';
        const req = {
          id: uid(),
          workerId: worker.id, name: worker.name,
          date, startTime: start, endTime: end, reason, hours,
          status: 'pending', pay: null,
          submittedAt: new Date().toISOString(),
          reviewedAt: null, reviewedBy: null
        };
        const ok = await saveOutsourceRequest(req);
        if(ok){
          const mineHtml = await renderMySubmissions(worker);
          body.innerHTML = `
            <div class="confirm">
              <div class="mark">&#10003;</div>
              <h2>Submitted</h2>
              <div class="ts">${escapeHtml(worker.name)} &middot; ${date} &middot; ${hours}h</div>
              <div style="margin-top:14px;font-size:12.5px;color:var(--muted);">Waiting for admin approval.</div>
            </div>
            <div style="margin-top:24px;">
              <div style="font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px;">My Submissions</div>
              <div>${mineHtml}</div>
            </div>`;
        } else {
          this.disabled = false; this.textContent = 'Submit for Approval';
          msg.style.color = 'var(--red)'; msg.textContent = 'Could not submit — check your connection and try again.';
        }
      };
    }
  }

  async function renderClockForm(body, cfg, today){
    // Filled in once the worker passes the geofence check on their way to
    // the clock screen.
    let lat = null, lon = null, dist = null, locationName = null;
    function setClockLocation(la, lo, d, name){ lat = la; lon = lo; dist = d; locationName = name; }
    const deviceId = getDeviceId();
    const workers = await getWorkers();

    if(workers.length === 0){
      body.innerHTML = `
        <div class="banner banner-err">
          <strong>Worker IDs not set up yet.</strong><br>
          Ask your admin to create worker IDs in the Worker IDs tab before anyone can clock in or out.
        </div>`;
      return;
    }

    renderLoginStep();

    function renderLoginStep(){
      let selectedName = '';
      body.innerHTML = `
        <div class="field">
          <label>Your name</label>
          <input type="text" id="w-name" placeholder="Search your name…" autocomplete="off">
          <div id="w-name-results"></div>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="w-login-pass" placeholder="Your password">
        </div>
        <button class="btn btn-primary" id="login-btn">Log In</button>
        <div id="login-msg" style="margin-top:10px;font-size:13px;"></div>
        <div style="text-align:center;margin-top:16px;">
          <a href="${baseUrl()}#outsource" style="font-size:12.5px;color:var(--muted);text-decoration:underline;">Need to submit an outsource request instead?</a>
        </div>
      `;
      const nameInput = document.getElementById('w-name');
      const nameResults = document.getElementById('w-name-results');
      nameInput.oninput = () => {
        selectedName = '';
        nameInput.style.borderColor = '';
        const q = nameInput.value.trim().toLowerCase();
        if(!q){ nameResults.innerHTML = ''; return; }
        const matches = workers.filter(w => w.name.toLowerCase().includes(q)).slice(0, 6);
        nameResults.innerHTML = matches.map(w =>
          `<div class="w-name-opt" data-name="${escapeHtml(w.name)}" style="padding:10px 12px;border:1px solid var(--line);border-top:none;cursor:pointer;font-size:14px;">${escapeHtml(w.name)}</div>`
        ).join('');
        nameResults.querySelectorAll('.w-name-opt').forEach(opt=>{
          opt.onclick = () => {
            selectedName = opt.dataset.name;
            nameInput.value = selectedName;
            nameInput.style.borderColor = 'var(--green)';
            nameResults.innerHTML = '';
            document.getElementById('w-login-pass').focus();
          };
        });
      };

      function checkLocationThenClock(worker){
        const locs = getLocations(cfg || {});
        if(locs.length === 0){
          body.innerHTML = `<div class="banner banner-err">No clock-in location has been set up yet. Ask your admin to add one.</div>
            <button class="btn btn-ghost" id="loc-back" style="width:100%;margin-top:14px;">Back</button>`;
          document.getElementById('loc-back').onclick = ()=> showWorkerMenu(worker);
          return;
        }
        if(!navigator.geolocation){
          body.innerHTML = `<div class="banner banner-err">Your device doesn't support location services, so clocking can't be verified.</div>
            <button class="btn btn-ghost" id="loc-back" style="width:100%;margin-top:14px;">Back</button>`;
          document.getElementById('loc-back').onclick = ()=> showWorkerMenu(worker);
          return;
        }
        body.innerHTML = `<div class="empty">Checking your location…</div>`;
        navigator.geolocation.getCurrentPosition(function(pos){
          const la = pos.coords.latitude, lo = pos.coords.longitude;
          const results = locs.map(L => ({ ...L, dist: haversine(la, lo, L.lat, L.lng) }));
          const matched = results.filter(r => r.dist <= r.radiusM).sort((a,b)=>a.dist-b.dist)[0];
          if(!matched){
            const nearest = results.slice().sort((a,b)=>a.dist-b.dist)[0];
            const distList = results.map(r => `${escapeHtml(r.name)}: ${Math.round(r.dist)}m (need within ${r.radiusM}m)`).join('<br>');
            body.innerHTML = `
              <div style="text-align:center;padding:20px 10px 10px;">
                <div style="font-size:38px;">📍</div>
                <h2 style="font-family:'Space Grotesk',sans-serif;margin:8px 0 4px;">Too far from site</h2>
                <div class="distance-badge distance-bad">${Math.round(nearest.dist)}m away &middot; need within ${nearest.radiusM}m</div>
                <div style="font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6;">${distList}</div>
                <div style="font-size:12.5px;color:var(--muted);margin-top:16px;">Move closer to a clock-in point and try again.</div>
              </div>
              <button class="btn btn-ghost" id="loc-back" style="width:100%;margin-top:8px;">Back</button>`;
            document.getElementById('loc-back').onclick = ()=> showWorkerMenu(worker);
            return;
          }
          setClockLocation(la, lo, matched.dist, matched.name);
          proceedToClockForm(worker);
        }, function(){
          body.innerHTML = `
            <div class="banner banner-err">
              <strong>Location access needed to clock in.</strong><br>
              Allow location permission in your browser settings, then try again.
            </div>
            <button class="btn btn-ghost" id="loc-back" style="width:100%;margin-top:14px;">Back</button>`;
          document.getElementById('loc-back').onclick = ()=> showWorkerMenu(worker);
        }, {enableHighAccuracy:true, timeout:12000});
      }

      function showWorkerMenu(worker){
        const canClock = worker.accessMode !== 'outsource';
        const canOutsource = worker.accessMode !== 'clock';
        body.innerHTML = `
          <div class="field">
            <label>Logged in as</label>
            <div style="padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;color:var(--ink);background:var(--paper,#F7F8FB);">${escapeHtml(worker.name)}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px;margin-top:6px;">
            ${canClock ? `<button class="btn btn-primary" id="menu-clock" style="width:100%;padding:16px;font-size:15px;">🕐 Clock In / Clock Out</button>` : ''}
            ${canOutsource ? `<button class="btn btn-ghost" id="menu-outsource" style="width:100%;padding:16px;font-size:15px;">📝 Outsource Request</button>` : ''}
            ${worker.onRoster ? `<button class="btn btn-ghost" id="menu-shift" style="width:100%;padding:16px;font-size:15px;">📅 My Shifts</button>` : ''}
          </div>
        `;
        const cBtn = document.getElementById('menu-clock');
        // Clocking is the only thing that needs to be on site, so the geofence
        // check happens here rather than blocking login.
        if(cBtn) cBtn.onclick = ()=> checkLocationThenClock(worker);
        const oBtn = document.getElementById('menu-outsource');
        if(oBtn) oBtn.onclick = ()=>{ window.location.href = baseUrl() + '#outsource'; };
        const sBtn = document.getElementById('menu-shift');
        if(sBtn) sBtn.onclick = ()=> renderWorkerRoster(body, worker, ()=> showWorkerMenu(worker));
      }

      const doLogin = async () => {
        const btn = document.getElementById('login-btn');
        const pass = document.getElementById('w-login-pass').value;
        const msg = document.getElementById('login-msg');
        if(!selectedName){
          nameInput.style.borderColor = 'var(--red)';
          msg.style.color = 'var(--red)'; msg.textContent = 'Please select your name from the list.';
          return;
        }
        if(!pass){
          msg.style.color = 'var(--red)'; msg.textContent = 'Please enter your password.';
          return;
        }
        btn.disabled = true; btn.textContent = 'Checking…';
        const worker = workers.find(w => w.name === selectedName);
        const hash = await sha256Hex(pass);
        if(!worker || hash !== worker.passwordHash){
          btn.disabled = false; btn.textContent = 'Log In';
          msg.style.color = 'var(--red)'; msg.textContent = 'Incorrect name or password.';
          return;
        }
        if(worker.accessMode === 'outsource'){
          showWorkerMenu(worker);   // no device link needed — they never clock in
          return;
        }
        if(worker.deviceId && worker.deviceId !== deviceId){
          body.innerHTML = `
            <div class="banner banner-err">
              <strong>This ID is linked to another device.</strong><br>
              Contact your admin to unlock it before logging in from this phone.
            </div>`;
          return;
        }
        if(!worker.deviceId){
          btn.textContent = 'Linking device…';
          const ok = await saveWorker({ ...worker, deviceId });
          if(!ok){
            btn.disabled = false; btn.textContent = 'Log In';
            msg.style.color = 'var(--red)'; msg.textContent = 'Could not link this device — try again.';
            return;
          }
          worker.deviceId = deviceId;
        }
        showWorkerMenu(worker);
      };
      document.getElementById('login-btn').onclick = doLogin;
      document.getElementById('w-login-pass').onkeydown = (e) => { if(e.key === 'Enter') doLogin(); };
    }

    async function proceedToClockForm(worker){
      const name = worker.name;
      // Fetch today's shift entries once — used to determine this device's next
      // allowed action, and to flag cross-name device reuse.
      let todaysEntries = [];
      try{
        const snap = await db.collection('epx_log').where('date', '==', today).get();
        todaysEntries = snap.docs.map(d => d.data());
      }catch(e){ console.error('log fetch failed:', e); }

      const deviceEntries = todaysEntries.filter(e => e.deviceId === deviceId).sort((a,b)=> a.ts.localeCompare(b.ts));
      const lastDeviceEntry = deviceEntries[deviceEntries.length - 1];

      // Once a device has clocked in AND out on today's code, it's done — no more submissions.
      if(lastDeviceEntry && lastDeviceEntry.type === 'out'){
        body.innerHTML = `
          <div class="banner banner-warn">
            <strong>Already completed today.</strong><br>
            This device already clocked in and out using today's code. See your admin if this looks wrong.
          </div>`;
        return;
      }

      // First scan of the day → Clock In only. After clocking in → Clock Out only.
      const selectedType = lastDeviceEntry ? 'out' : 'in';

      body.innerHTML = `
        <a class="backlink" href="#" id="clk-back">&lsaquo; Back</a>
        <div class="distance-badge distance-ok" style="display:block;text-align:center;margin:12px 0 18px;">On site${locationName ? ' &middot; ' + escapeHtml(locationName) : ''} &middot; ${Math.round(dist)}m from point</div>
        <div class="field">
          <label>Logged in as</label>
          <div style="padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;color:var(--ink);background:var(--paper,#F7F8FB);">${escapeHtml(name)}</div>
        </div>
        <div class="field">
          <label>Action</label>
          <div class="toggle-group">
            <div class="toggle-opt ${selectedType} selected" style="pointer-events:none;">${selectedType === 'in' ? 'Clock In' : 'Clock Out'}</div>
          </div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:6px;">${selectedType === 'in' ? "First scan today on this device — Clock In only." : "This device already clocked in today — only Clock Out is available now."}</div>
        </div>
        <div class="field">
          <label>Selfie (required)</label>
          <input type="file" accept="image/*" capture="user" id="w-selfie-input" style="display:none">
          <button type="button" class="btn" id="w-selfie-btn" style="width:100%;">📷 Take Selfie</button>
          <div id="w-selfie-preview" style="margin-top:10px;text-align:center;"></div>
        </div>
        <button class="btn btn-primary" id="submit-btn">Confirm &amp; Submit</button>
      `;

      let selfieBlob = null;
      const selfieInput = document.getElementById('w-selfie-input');
      const selfieBtn = document.getElementById('w-selfie-btn');
      const selfiePreview = document.getElementById('w-selfie-preview');
      selfieBtn.onclick = () => selfieInput.click();
      selfieInput.onchange = async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        selfieBtn.disabled = true;
        selfieBtn.textContent = 'Processing…';
        try{
          selfieBlob = await compressImage(file);
          const url = URL.createObjectURL(selfieBlob);
          selfiePreview.innerHTML = `<img src="${url}" style="width:96px;height:96px;object-fit:cover;border-radius:12px;border:2px solid var(--line);">`;
          selfieBtn.textContent = '📷 Retake Selfie';
        }catch(e){
          selfieBtn.textContent = '📷 Take Selfie';
          alert('Could not process that photo — please try again.');
        }
        selfieBtn.disabled = false;
      };

      const clkBack = document.getElementById('clk-back');
      if(clkBack) clkBack.onclick = (e)=>{ e.preventDefault(); showWorkerMenu(worker); };

      document.getElementById('submit-btn').onclick = async function(){
        if(!selfieBlob){
          selfieBtn.style.borderColor = 'var(--red)';
          alert('Please take a selfie before submitting.');
          return;
        }
        this.disabled = true;
        this.textContent = 'Submitting…';
        const now = new Date();
        const entryId = uid();

        // Flag if this same phone already clocked in/out under a different name today
        // (can still happen if an admin manually unlocks a device for someone else)
        let flagged = false, flagReason = '';
        const otherName = todaysEntries.find(e => e.deviceId === deviceId && e.name !== name);
        if(otherName){
          flagged = true;
          flagReason = `Same phone also used for "${otherName.name}" today`;
        }

        this.textContent = 'Processing photo…';
        let photoUrl = '';
        try{ photoUrl = await blobToDataUrl(selfieBlob); }catch(e){ console.error('photo processing failed:', e); }

        const entry = {
          id: entryId,
          name: name,
          workerId: worker.id,
          type: selectedType,
          ts: now.toISOString(),
          date: today,
          distanceM: Math.round(dist),
          location: locationName || '',
          lat: lat, lng: lon,
          deviceId: deviceId,
          photoUrl: photoUrl || '',
          flagged: flagged,
          flagReason: flagReason
        };
        this.textContent = 'Saving…';
        const ok = await appendLog(entry);
        if(ok){
          body.innerHTML = `
            <div class="confirm">
              <div class="mark ${selectedType==='out'?'out':''}">${selectedType==='out'?'&#10003;':'&#10003;'}</div>
              <h2>${selectedType==='in' ? 'Clocked In' : 'Clocked Out'}</h2>
              <div class="ts">${escapeHtml(name)} &middot; ${fmtTime(now)}</div>
              ${flagged ? `<div style="margin-top:14px;font-size:12.5px;color:var(--red);">⚠ Flagged for admin review: ${escapeHtml(flagReason)}</div>` : ''}
            </div>`;
        } else {
          this.disabled = false;
          this.textContent = 'Confirm & Submit';
          alert('Could not save — check your connection and try again.');
        }
      };
    }
  }

        document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        document.getElementById('view-'+t.dataset.view).classList.add('active');
        if(t.dataset.view === 'roster') renderRoster();
        if(t.dataset.view === 'log') renderLog();
        if(t.dataset.view === 'kiosk') renderKiosk();
        if(t.dataset.view === 'workers') renderWorkerIds();
        if(t.dataset.view === 'outsource') renderOutsourceAdmin();
        if(t.dataset.view === 'basepay') renderBasePay();
        if(t.dataset.view === 'outsourcepay') renderOutsourcePay();
      };
    });

    await renderKiosk();
    renderSetup();

    // If this screen is left open (e.g. a dedicated tablet at the entrance),
    // silently regenerate the QR the moment the shift day rolls over — no
    // one needs to reopen or resend anything.
    let kioskShiftDate = shiftDateStr();
    setInterval(() => {
      const nowDate = shiftDateStr();
      if(nowDate !== kioskShiftDate){
        kioskShiftDate = nowDate;
        if(document.getElementById('view-kiosk').classList.contains('active')){
          renderKiosk();
        }
      }
    }, 60000);
  }

  async function renderKiosk(){
    const el = document.getElementById('view-kiosk');
    const cfg = await getConfig();
    const today = shiftDateStr();
    const locs = getLocations(cfg || {});

    if(!cfg || locs.length === 0){
      el.innerHTML = `
        <div class="card" style="text-align:center;">
          <div class="eyebrow">Step 1 of 1</div>
          <h3 style="justify-content:center;">Set up your location first</h3>
          <div class="help">Head to the Setup tab to set your clock-in point and radius. Your QR code will appear here once that's done.</div>
        </div>`;
      return;
    }

    const token = cfg.permanentLink ? permanentToken(cfg.secret) : dailyToken(cfg.secret, today);
    const url = baseUrl() + '#worker&token=' + token + '&date=' + today;
    const radiusHint = locs.length > 1
      ? locs.map(l => `${escapeHtml(l.name)} (${l.radiusM}m)`).join(' or ')
      : `radius ${locs[0].radiusM}m`;
    const footHint = cfg.permanentLink
      ? `This link never expires — send it once and you're done.<br>${radiusHint}.`
      : `Display this at ${cfg.companyName || 'your'} clock-in point.<br>Resets automatically at 6:00 AM &middot; ${radiusHint}.`;

    el.innerHTML = `
      <div class="status-strip">
        <div class="stat"><div class="n" id="stat-in">–</div><div class="l">Clocked in today</div></div>
        <div class="stat"><div class="n" id="stat-out">–</div><div class="l">Clocked out today</div></div>
      </div>
      <div class="ticket">
        <div class="ticket-head">
          <span class="label">Daily Clock Code</span>
          <span class="date mono">${cfg.permanentLink ? 'PERMANENT' : today}</span>
        </div>
        <div class="ticket-body">
          <div id="qr-box"></div>
          <div class="token-row">
            <span class="code">${token}</span>
          </div>
        </div>
        <div class="perf"></div>
        <div class="ticket-foot">
          <button class="btn btn-ghost" id="copy-link-btn" style="width:100%;margin-bottom:10px;">🔗 Copy Worker Link</button>
          <div class="hint">${footHint}</div>
        </div>
      </div>
      <div class="card">
        <h3>Recent Activity</h3>
        <div id="kiosk-audit"><div class="empty">Loading…</div></div>
      </div>
    `;
    document.getElementById('copy-link-btn').onclick = async function(){
      const btn = this;
      try{
        await navigator.clipboard.writeText(url);
        btn.textContent = '✓ Link copied';
      }catch(e){
        btn.textContent = 'Could not copy — long-press the QR instead';
      }
      setTimeout(()=>{ btn.textContent = '🔗 Copy Worker Link'; }, 2200);
    };
    new QRCode(document.getElementById('qr-box'), {
      text: url,
      width: 208,
      height: 208,
      colorDark: '#14213D',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    const todayCounts = await getLogCountsForDate(today);
    document.getElementById('stat-in').textContent = todayCounts.in;
    document.getElementById('stat-out').textContent = todayCounts.out;

    const auditEntries = await getAuditLog(20);
    const auditBox = document.getElementById('kiosk-audit');
    if(auditEntries.length === 0){
      auditBox.innerHTML = `<div class="empty">No activity yet.</div>`;
    } else {
      auditBox.innerHTML = auditEntries.map(a => `
        <div style="padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;">
          <span style="color:var(--muted);font-family:'IBM Plex Mono',monospace;">${new Date(a.ts).toLocaleString()}</span>
          &middot; ${escapeHtml(a.summary || a.action)}
        </div>
      `).join('');
    }
  }

    document.getElementById('wk-save').onclick = async function(){
      const name = document.getElementById('wk-name').value.trim();
      const pass = document.getElementById('wk-pass').value;
      const rateRaw = document.getElementById('wk-rate').value;
      const otRateRaw = document.getElementById('wk-outsource-rate').value;
      const workStartTime = document.getElementById('wk-start-time').value || null;
      const msg = document.getElementById('wk-msg');
      if(!name){ msg.style.color='var(--red)'; msg.textContent='Name is required.'; return; }
      if(!editingId && pass.length < 4){ msg.style.color='var(--red)'; msg.textContent='Set a password (at least 4 characters).'; return; }
      if(pass && pass.length > 0 && pass.length < 4){ msg.style.color='var(--red)'; msg.textContent='Password must be at least 4 characters.'; return; }
      const dailyRate = rateRaw === '' ? null : parseFloat(rateRaw);
      if(dailyRate !== null && (isNaN(dailyRate) || dailyRate < 0)){ msg.style.color='var(--red)'; msg.textContent='Daily rate must be a valid number (0 or more).'; return; }
      const otRatePerHour = otRateRaw === '' ? null : parseFloat(otRateRaw);
      if(otRatePerHour !== null && (isNaN(otRatePerHour) || otRatePerHour < 0)){ msg.style.color='var(--red)'; msg.textContent='Outsource rate must be a valid number (0 or more).'; return; }

      this.disabled = true; this.textContent = 'Saving…';
      const priorWorkers = await getWorkers();
      // Warn before creating a second record under an existing name — this is
      // easy to do by accident and splits someone's clock history in two.
      const clash = priorWorkers.find(w => w.id !== editingId && String(w.name||'').trim().toLowerCase() === name.toLowerCase());
      if(clash && !confirm(`A worker called "${clash.name}" already exists.\n\nAdding another with the same name splits their records between two IDs. Continue anyway?`)){
        this.disabled = false; this.textContent = editingId ? 'Save Changes' : 'Add Worker';
        return;
      }
      const prior = editingId ? priorWorkers.find(w => w.id === editingId) : null;
      let passwordHash;
      if(editingId){
        passwordHash = pass ? await sha256Hex(pass) : (prior ? prior.passwordHash : null);
      } else {
        passwordHash = await sha256Hex(pass);
      }
      const worker = {
        id: editingId || uid(),
        name, icFront: icFrontData, icBack: icBackData,
        passwordHash, employmentType, paymentTerm: term, dailyRate,
        otRatePerHour, workStartTime, accessMode,
        onRoster: document.getElementById('wk-on-roster').checked,
        rosterGroup: document.getElementById('wk-roster-group').value || 'A',
        rosterShiftId: document.getElementById('wk-roster-shift').value || null,
        partnerId: document.getElementById('wk-partner').value || null,
        jobRoleId: document.getElementById('wk-job-role').value || null,
        deviceId: prior ? (prior.deviceId || null) : null,
        createdAt: prior ? (prior.createdAt || new Date().toISOString()) : new Date().toISOString()
      };
      const ok = await saveWorker(worker);
      if(ok){
        // Pairing is mutual — mirror it onto the partner, and clear any
        // previous partner who would otherwise still point back at this worker.
        try{
          const prevPartnerId = prior && prior.partnerId ? prior.partnerId : null;
          if(prevPartnerId && prevPartnerId !== worker.partnerId){
            const old = priorWorkers.find(x=>x.id === prevPartnerId);
            if(old && old.partnerId === worker.id) await saveWorker({ ...old, partnerId: null });
          }
          if(worker.partnerId){
            const mate = priorWorkers.find(x=>x.id === worker.partnerId);
            if(mate){
              // If the new partner was paired with someone else, release that one too.
              if(mate.partnerId && mate.partnerId !== worker.id){
                const third = priorWorkers.find(x=>x.id === mate.partnerId);
                if(third && third.partnerId === mate.id) await saveWorker({ ...third, partnerId: null });
              }
              if(mate.partnerId !== worker.id) await saveWorker({ ...mate, partnerId: worker.id });
            }
          }
        }catch(e){ console.error('Could not sync partner pairing:', e); }
        logAudit(editingId ? 'edit_worker' : 'add_worker', 'worker', worker.id, `${editingId ? 'Edited' : 'Created'} worker ID for ${name}`);
      }
      this.disabled = false; this.textContent = 'Save Worker ID';
      if(ok){
        msg.style.color = 'var(--green)';
        msg.textContent = 'Saved.';
        resetForm();
        drawList();
      } else {
        msg.style.color = 'var(--red)';
        msg.textContent = 'Could not save — try again.';
      }
    };
  }

    async function generatePv(rows, type, label, refreshFn){
      const unpaid = rows.filter(r => rowTotal(r) != null && !paidInfo(r));
      if(unpaid.length === 0){ alert('Nothing unpaid to generate a PV for.'); return; }
      if(!confirm(`Generate a Base Pay Voucher for ${unpaid.length} record(s), totalling RM${unpaid.reduce((s,r)=>s+rowTotal(r),0).toFixed(2)}?\n\nOnce generated, these records are locked and marked as paid — this can't be undone.`)) return;

      const pvNumber = await getNextPvNumber();
      if(!pvNumber){ alert('Could not generate PV number — try again.'); return; }

      const total = unpaid.reduce((s,r)=> s + rowTotal(r), 0);
      const pv = {
        pvNumber, type, label,
        rows: unpaid.map(r => ({ name: r.name, date: r.date, hours: r.hours, minutes: r.minutes, total: rowTotal(r) })),
        totalPay: Math.round(total * 100) / 100,
        generatedAt: new Date().toISOString(),
        generatedBy: 'admin'
      };
      const ok = await savePv(pv);
      if(!ok){ alert('Could not save the PV — try again.'); return; }

      const entryIds = [];
      unpaid.forEach(r => {
        if(r.clockIn) entryIds.push(r.clockIn.id);
        if(r.clockOut) entryIds.push(r.clockOut.id);
      });
      await markEntriesPaid(entryIds, pvNumber);
      await logAudit('generate_pv', 'pv', pvNumber, `Generated ${pvNumber} — ${label}, RM${pv.totalPay.toFixed(2)}`);

      alert(`${pvNumber} generated. Total RM${pv.totalPay.toFixed(2)} — records are now locked.`);
      printPv(pv);
      refreshFn();
      drawPvList();
    }

        if(!groups[key]) groups[key] = { name: r.name, workerId: r.workerId, date: r.date, hours: 0, requestIds: [], times: [] };

        g.times.push(`${r.startTime}\u2013${r.endTime}`);

      // the rate that happened to be set when the request was approved —
      // any rate change (including one that was previously left blank) is

      return Object.values(groups).map(g => {

    async function generateOutsourcePv(rows, type, label, refreshFn){
      const unpaid = rows.filter(r => r.pay > 0);
      if(unpaid.length === 0){ alert('Nothing unpaid to generate a PV for.'); return; }
      if(!confirm(`Generate an Outsource Pay Voucher for ${unpaid.length} record(s), totalling RM${unpaid.reduce((s,r)=>s+r.pay,0).toFixed(2)}?\n\nOnce generated, these requests are locked and marked as paid — this can't be undone.`)) return;

      const pvNumber = await getNextPvNumber();
      if(!pvNumber){ alert('Could not generate PV number — try again.'); return; }

      const total = unpaid.reduce((s,r)=> s + r.pay, 0);
      const pv = {
        pvNumber, type: 'outsource', label,
        rows: unpaid.map(r => ({ name: r.name, date: r.date, times: r.times || [], hours: r.hours, pay: r.pay })),
        totalPay: Math.round(total * 100) / 100,
        generatedAt: new Date().toISOString(),
        generatedBy: 'admin'
      };
      const ok = await savePv(pv);
      if(!ok){ alert('Could not save the PV — try again.'); return; }

      const outsourceIds = [];
      unpaid.forEach(r => { if(r.requestIds) outsourceIds.push(...r.requestIds); });
      await markOutsourcePaid(outsourceIds, pvNumber);

      printOutsourcePv(pv);
      refreshFn();

    let sortCol = 'date', sortDir = -1;
    function applySort(rows){
      return rows.slice().sort((a,b)=>{
        let av = a[sortCol], bv = b[sortCol];
        if(sortCol === 'hours'){ av = Number(av)||0; bv = Number(bv)||0; }
        else { av = String(av==null?'':av); bv = String(bv==null?'':bv); }
        if(av < bv) return -1 * sortDir;
        if(av > bv) return 1 * sortDir;
        return 0;
      });
    }

    let ouLoadAll = false;
    async function draw(){
      const [allReqs, workers] = await Promise.all([getOutsourceRequests(ouLoadAll ? Infinity : undefined), getWorkers()]);
      const status = document.getElementById('ou-filter').value;
      const fromDate = document.getElementById('ou-from').value;
      const toDate = document.getElementById('ou-to').value;
      const nameQuery = document.getElementById('ou-name').value.trim().toLowerCase();
      const paidFilter = document.getElementById('ou-paid').value;

      // Duplicate map is built from every request so the flag survives filtering.
      const dupCountPre = {};
      allReqs.forEach(r=>{
        if(r.status === 'rejected') return;
        const k = (r.workerId || r.name) + '||' + r.date;
        dupCountPre[k] = (dupCountPre[k] || 0) + 1;
      });
      let filtered;
      if(status === 'all'){ filtered = allReqs; }
      else if(status === 'flagged'){
        filtered = allReqs.filter(r => r.status !== 'rejected' && dupCountPre[(r.workerId || r.name) + '||' + r.date] > 1);
      }
      else { filtered = allReqs.filter(r => r.status === status); }
      if(fromDate) filtered = filtered.filter(r => r.date >= fromDate);
      if(toDate) filtered = filtered.filter(r => r.date <= toDate);
      if(nameQuery) filtered = filtered.filter(r => String(r.name||'').toLowerCase().includes(nameQuery));
      if(paidFilter === 'paid') filtered = filtered.filter(r => !!r.paidPv);
      else if(paidFilter === 'unpaid') filtered = filtered.filter(r => !r.paidPv);
      filtered = applySort(filtered);

      const list = document.getElementById('ou-list');
      if(filtered.length === 0){
        // Distinguish "nothing loaded at all" from "filters excluded everything" —
        // otherwise a failed fetch looks identical to a genuinely empty filter result.
        list.innerHTML = allReqs.length === 0
          ? `<div class="empty">No outsource requests found. If you're expecting some, check the browser console for load errors.</div>`
          : `<div class="empty">No outsource requests match these filters. (${allReqs.length} total on record.)</div>`;
        return;
      }
      const sortArrow = (col) => sortCol === col ? (sortDir === 1 ? ' ▲' : ' ▼') : '';

      // Count submissions per worker per date across EVERY request, not just
      // the filtered view — otherwise filtering by status would hide the very
      // duplicates we're trying to surface. Rejected ones don't count: a
      // rejected request that was resubmitted is a correction, not a double-claim.
      const dupCount = {};
      allReqs.forEach(r=>{
        if(r.status === 'rejected') return;
        const key = (r.workerId || r.name) + '||' + r.date;
        dupCount[key] = (dupCount[key] || 0) + 1;
      });
      const dupKeyFor = r => (r.workerId || r.name) + '||' + r.date;
      const flaggedInView = filtered.filter(r => r.status !== 'rejected' && dupCount[dupKeyFor(r)] > 1).length;

      list.innerHTML = `
        ${(!ouLoadAll && allReqs.length >= OUTSOURCE_RECENT_LIMIT) ? `<div class="help" style="margin-bottom:10px;">Showing the ${OUTSOURCE_RECENT_LIMIT} most recent requests. <a href="#" id="ou-load-all" style="color:var(--ink);font-weight:600;">Load full history</a> — slower, only needed for older records.</div>` : ''}
        ${flaggedInView > 0 ? `<div class="banner banner-err" style="margin-bottom:12px;">⚠️ ${flaggedInView} row${flaggedInView===1?'':'s'} below ${flaggedInView===1?'is':'are'} flagged — the same worker has more than one live request for that date. Check the hours don't overlap before approving.</div>` : ''}
        <table class="logtable">
          <thead><tr>
            <th data-sort="date" style="cursor:pointer;">Date${sortArrow('date')}</th>
            <th data-sort="name" style="cursor:pointer;">Name${sortArrow('name')}</th>
            <th data-sort="startTime" style="cursor:pointer;">Start Time${sortArrow('startTime')}</th>
            <th data-sort="endTime" style="cursor:pointer;">End Time${sortArrow('endTime')}</th>
            <th>Reason of Outsource</th>
            <th data-sort="hours" style="cursor:pointer;">Hours${sortArrow('hours')}</th>
            <th data-sort="status" style="cursor:pointer;">Status${sortArrow('status')}</th>
            <th>Paid</th>
            <th></th>
          </tr></thead>
          <tbody>
            ${filtered.map(r => {
              const worker = workers.find(w => w.id === r.workerId);
              const rate = worker && worker.otRatePerHour != null ? worker.otRatePerHour : null;
              const estPay = rate != null ? Math.round(r.hours * rate * 100) / 100 : null;
              const statusColor = r.status === 'approved' ? 'var(--green)' : r.status === 'rejected' ? 'var(--red)' : 'var(--amber)';
              const nDup = r.status === 'rejected' ? 0 : (dupCount[dupKeyFor(r)] || 0);
              const isDup = nDup > 1;
              return `
                <tr${isDup ? ' style="background:rgba(214,69,69,0.06);"' : ''}>
                  <td class="mono">${r.date}${isDup ? `<br><span style="font-size:10px;font-weight:700;color:var(--red);">⚠️ ${nDup}× this date</span>` : ''}</td>
                  <td>${escapeHtml(r.name)}</td>
                  <td class="mono">${r.startTime}</td>
                  <td class="mono">${r.endTime}</td>
                  <td>
                    ${escapeHtml(r.reason)}${r.reviewRemark ? `<br><span style="font-size:10.5px;color:var(--red);">💬 ${escapeHtml(r.reviewRemark)}</span>` : ''}
                    ${r.workerId ? `<br><button class="btn btn-ghost btn-sm" data-clock="${r.id}" data-wid="${r.workerId}" data-date="${r.date}" style="padding:2px 7px;font-size:10px;margin-top:4px;">Clock times</button>` : ''}
                    <div id="clk-${r.id}" style="font-size:10.5px;margin-top:3px;"></div>
                  </td>
                  <td class="mono">${r.hours}h${estPay != null ? '<br><span style="color:var(--muted);font-size:10.5px;">RM'+estPay.toFixed(2)+'</span>' : ''}</td>
                  <td>
                    <span style="text-transform:uppercase;font-size:10px;font-weight:700;color:${statusColor};">${r.status}</span>
                  </td>
                  <td>
                    ${r.paidPv
                      ? `<span style="font-size:10px;font-weight:700;color:var(--green);">PAID</span><br><span style="font-size:10px;color:var(--muted);">${escapeHtml(r.paidPv)}</span>`
                      : `<span style="font-size:10px;font-weight:700;color:var(--muted);">UNPAID</span>`}
                  </td>
                  <td>
                    ${r.status === 'pending' ? `
                      <div style="display:flex;gap:6px;">
                        <button class="btn btn-primary btn-sm" data-approve="${r.id}">Approve</button>
                        <button class="btn btn-ghost btn-sm" data-reject="${r.id}">Reject</button>
                      </div>
                    ` : ''}
                    ${(r.status === 'approved' || r.status === 'rejected') && !r.paidPv ? `
                      <button class="btn btn-ghost btn-sm" data-unapprove="${r.id}">Undo &rarr; Pending</button>
                    ` : ''}
                    ${r.paidPv ? `<span style="font-size:10px;color:var(--muted);">Locked (paid)</span>` : ''}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;

      list.querySelectorAll('[data-sort]').forEach(th=>{
        th.onclick = () => {
          const col = th.dataset.sort;
          if(sortCol === col){ sortDir *= -1; } else { sortCol = col; sortDir = 1; }
          draw();
        };
      });
      list.querySelectorAll('[data-clock]').forEach(btn=>{
        btn.onclick = async ()=>{
          const slot = document.getElementById('clk-' + btn.dataset.clock);
          if(slot.innerHTML){ slot.innerHTML = ''; return; } // toggle off
          slot.innerHTML = `<span style="color:var(--muted);">Checking…</span>`;
          const t = await getClockTimesFor(btn.dataset.wid, btn.dataset.date);
          if(!t || t.count === 0){
            slot.innerHTML = `<span style="color:var(--muted);">No clock records that day</span>`;
            return;
          }
          const req = filtered.find(x => x.id === btn.dataset.clock);
          // Flag the case that actually matters: OT claimed inside the hours
          // they were already clocked in for.
          let warn = '';
          if(req && t.inTime && t.outTime && req.startTime < t.outTime && req.endTime > t.inTime){
            warn = `<br><span style="color:var(--red);font-weight:700;">⚠️ Overlaps their clocked shift</span>`;
          }
          slot.innerHTML = `<span style="color:var(--ink);">🕐 In ${t.inTime || '—'} &middot; Out ${t.outTime || '—'}</span>${warn}`;
        };
      });
      const ouAllLink = document.getElementById('ou-load-all');
      if(ouAllLink) ouAllLink.onclick = (ev)=>{ ev.preventDefault(); ouLoadAll = true; draw(); };
      list.querySelectorAll('[data-approve]').forEach(btn=>{
        btn.onclick = async () => {
          const req = filtered.find(r => r.id === btn.dataset.approve);
          if(!req) return;
          const worker = workers.find(w => w.id === req.workerId);
          const rate = worker && worker.otRatePerHour != null ? worker.otRatePerHour : null;
          const pay = rate != null ? Math.round(req.hours * rate * 100) / 100 : null;
          btn.disabled = true; btn.textContent = 'Approving…';
          const ok = await saveOutsourceRequest({ ...req, status: 'approved', pay, reviewedAt: new Date().toISOString(), reviewedBy: 'admin' });
          if(ok) await logAudit('approve_outsource', 'outsource', req.id, `Approved outsource for ${req.name} — ${req.date}, ${req.hours}h`);
          draw();
        };
      });
      list.querySelectorAll('[data-reject]').forEach(btn=>{
        btn.onclick = async () => {
          const req = filtered.find(r => r.id === btn.dataset.reject);
          if(!req) return;
          const remark = prompt(`Reject this outsource request from ${req.name} (${req.date})?\n\nOptionally give a reason — the worker will see it. Leave blank for none, or press Cancel to stop.`);
          if(remark === null) return; // Cancel
          const reason = remark.trim() || null;
          btn.disabled = true; btn.textContent = 'Rejecting…';
          const ok = await saveOutsourceRequest({ ...req, status: 'rejected', pay: null, reviewedAt: new Date().toISOString(), reviewedBy: 'admin', reviewRemark: reason });
          if(ok) await logAudit('reject_outsource', 'outsource', req.id, `Rejected outsource for ${req.name} — ${req.date}${reason ? ' — ' + reason : ''}`);
          draw();
        };
      });
      list.querySelectorAll('[data-unapprove]').forEach(btn=>{
        btn.onclick = async () => {
          const req = filtered.find(r => r.id === btn.dataset.unapprove);
          if(!req) return;
          // Safety net: never revert something already paid out on a PV — the
          // voucher is a locked financial record and this would desync it.
          if(req.paidPv){
            alert(`Can't undo — this was already paid on ${req.paidPv}.`);
            return;
          }
          if(!confirm(`Send this ${req.status} request from ${req.name} back to Pending?`)) return;
          btn.disabled = true; btn.textContent = 'Undoing…';
          const prevStatus = req.status;
          const ok = await saveOutsourceRequest({ ...req, status: 'pending', pay: null, reviewedAt: null, reviewedBy: null, reviewRemark: null });
          if(ok) await logAudit('unapprove_outsource', 'outsource', req.id, `Reverted ${prevStatus} → pending for ${req.name} — ${req.date}`);
          draw();
        };
      });
    }

    draw();
    document.getElementById('ou-filter').onchange = () => draw();
    document.getElementById('ou-paid').onchange = () => draw();
    document.getElementById('ou-from').onchange = () => draw();
    document.getElementById('ou-to').onchange = () => draw();
    document.getElementById('ou-name').oninput = () => draw();
    document.getElementById('ou-clear').onclick = () => {
      document.getElementById('ou-from').value = '';
      document.getElementById('ou-to').value = '';
      document.getElementById('ou-name').value = '';
      document.getElementById('ou-filter').value = 'pending';
      document.getElementById('ou-paid').value = 'all';
      draw();
    };
  }

  // One day at a time. Every clock entry carries a selfie, so loading the
  // whole history to show a single day's records was the expensive part —
  // a date query fetches only what's actually on screen.
  async function getLogForDate(dateStr){
    if(!db) return [];
    try{
      const snap = await db.collection('epx_log').where('date', '==', dateStr).get();
      return snap.docs.map(d => d.data());
    }catch(e){ console.error('getLogForDate failed:', e); return []; }
  }
  // ---- Roster tab ----
  let rosterMonth = null; // 'YYYY-MM', defaults to the current month
  async function renderRoster(){
    const el = document.getElementById('view-roster');
    el.innerHTML = `<div class="empty">Loading roster…</div>`;
    if(!rosterMonth) rosterMonth = todayStr().slice(0,7);
    // Overrides for the month either side too, since a week can straddle a
    // month boundary and its key lives under the Monday's month.
    const [workers, shifts, cfg, jobRoles, ovThis, ovPrev, ovNext] = await Promise.all([
      getWorkers(), getRosterShifts(), getRosterConfig(), getJobRoles(),
      getRosterOverrides(rosterMonth),
      getRosterOverrides(shiftMonth(rosterMonth, -1)),
      getRosterOverrides(shiftMonth(rosterMonth, 1))
    ]);
    const overrides = Object.assign({}, ovPrev, ovThis, ovNext);

          <div class="field" style="margin-bottom:8px;"><label>Role name</label><input type="text" id="rs-role-name" placeholder="e.g. Forklift Driver"></div>
          <div class="field" style="margin-bottom:8px;"><label>Category <span style="font-weight:400;color:var(--muted);">optional</span></label><input type="text" id="rs-role-cat" placeholder="e.g. Warehouse"></div>
        </div>
        <button class="btn btn-primary btn-block" id="rs-role-add">Add Role</button>
        <div id="rs-role-msg" style="margin-top:8px;font-size:12.5px;"></div>
      </div>

      <div class="card">
        <h3>Public holidays</h3>
        <div class="help">Fixed-date holidays (Merdeka, Malaysia Day, Gawai, Sarawak Day, Christmas, New Year, Labour Day) are built in for every year. Hari Raya, Chinese New Year, Deepavali and Wesak move each year, so add those here once they're gazetted.</div>
        <div class="row2">
          <div class="field" style="margin-bottom:8px;"><label>Date</label><input type="date" id="rs-hol-date"></div>
          <div class="field" style="margin-bottom:8px;"><label>Holiday name</label><input type="text" id="rs-hol-name" placeholder="e.g. Hari Raya Aidilfitri"></div>
        </div>
        <button class="btn btn-primary btn-block" id="rs-hol-add">Add Holiday</button>
        <div id="rs-hol-msg" style="margin-top:8px;font-size:12.5px;"></div>
        <div id="rs-hol-list" style="margin-top:10px;"></div>
      </div>

      <div class="card">
        <h3>Rotation</h3>
        <div class="help">Paired workers swap both shift and group every week — pick the partner on each worker's record. Group A rests on Saturdays, Group B on Sundays, so a rotating pair's rest day moves with them. This date sets which week counts as week 1.</div>
        <div class="field"><label>Cycle starts on (a Monday)</label><input type="date" id="rs-anchor" value="${cfg.anchorMonday}"></div>
        <button class="btn btn-primary btn-block" id="rs-save-rot">Save</button>

      <div class="toprow" style="margin-top:6px;">
        <h2>${monthLabel(rosterMonth)}</h2>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-ghost btn-sm" id="rs-prev">&lsaquo;</button>
          <button class="btn btn-ghost btn-sm" id="rs-next">&rsaquo;</button>
        </div>
      </div>
      ${rostered.length === 0
        ? `<div class="card"><div class="empty">No workers on the roster yet.<br>Tick "Include this worker in the roster" on the Worker IDs tab.</div></div>`
        : `<div id="rs-calendar"></div>`}
    `;

    drawShiftList(shifts);
    drawJobRoleList(jobRoles);
    if(rostered.length > 0) drawRosterCalendar(rostered, shifts, cfg, jobRoles, overrides, customHols);
    drawHolidayList(customHols);

    document.getElementById('rs-hol-add').onclick = async function(){
      const date = document.getElementById('rs-hol-date').value;
      const name = document.getElementById('rs-hol-name').value.trim();
      const msg = document.getElementById('rs-hol-msg');
      if(!date || !name){ msg.style.color='var(--red)'; msg.textContent='Pick a date and enter a name.'; return; }
      this.disabled = true; this.textContent = 'Adding…';
      const list = await getHolidays();
      const i = list.findIndex(h=>h.date === date);
      if(i > -1) list[i] = { date, name }; else list.push({ date, name });

      this.disabled = false; this.textContent = 'Add Holiday';
