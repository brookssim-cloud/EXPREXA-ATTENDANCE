      const category = document.getElementById('rs-role-cat').value.trim() || null;

      if(!name){ msg.style.color='var(--red)'; msg.textContent='Enter a role name.'; return; }
      this.disabled = true; this.textContent = 'Adding…';
      const list = await getJobRoles();
      list.push({ id: uid(), name, category });
      const ok = await saveJobRoles(list);
      this.disabled = false; this.textContent = 'Add Role';
      if(ok) renderRoster();
      else { msg.style.color='var(--red)'; msg.textContent='Could not save — try again.'; }

    document.getElementById('rs-prev').onclick = ()=>{ rosterMonth = shiftMonth(rosterMonth, -1); renderRoster(); };
    document.getElementById('rs-next').onclick = ()=>{ rosterMonth = shiftMonth(rosterMonth, 1); renderRoster(); };

    // Entering a start time fills the end at +8h30; still editable for

    const rsStart = document.getElementById('rs-start');
    const rsEnd = document.getElementById('rs-end');
    if(rsStart) rsStart.onchange = ()=>{

    };

      const name = document.getElementById('rs-name').value.trim();
      const code = document.getElementById('rs-code').value.trim().toUpperCase();
      const start = document.getElementById('rs-start').value;
      const end = document.getElementById('rs-end').value;
      const msg = document.getElementById('rs-msg');
      if(!name || !code || !start || !end){ msg.style.color='var(--red)'; msg.textContent='Fill in every field.'; return; }
      this.disabled = true; this.textContent = 'Adding…';
      const list = await getRosterShifts();
      list.push({ id: uid(), name, code, start, end });
      const ok = await saveRosterShifts(list);
      this.disabled = false; this.textContent = 'Add Shift';
      if(ok) renderRoster();
      else { msg.style.color='var(--red)'; msg.textContent='Could not save — try again.'; }
    };

    document.getElementById('rs-save-rot').onclick = async function(){

      const msg = document.getElementById('rs-rot-msg');
      if(!anchor){ msg.style.color='var(--red)'; msg.textContent='Pick a start date.'; return; }
      const newCfg = { anchorMonday: mondayOf(anchor) };
      this.disabled = true; this.textContent = 'Saving…';
      const ok = await saveRosterConfig(newCfg);
      this.disabled = false; this.textContent = 'Save';
      if(ok) renderRoster();
      else { msg.style.color='var(--red)'; msg.textContent='Could not save — try again.'; }
    };
  }

  function monthLabel(ym){
    const [y,m] = ym.split('-').map(Number);
    return new Date(Date.UTC(y, m-1, 1)).toLocaleString(undefined, { month:'long', year:'numeric', timeZone:'UTC' });
  }
  function shiftMonth(ym, delta){
    const [y,m] = ym.split('-').map(Number);
    const d = new Date(Date.UTC(y, m-1+delta, 1));
    return d.toISOString().slice(0,7);
  }

  function drawShiftList(shifts){
    const el = document.getElementById('rs-shift-list');
    if(!el) return;
    if(shifts.length === 0){ el.innerHTML = `<div class="help" style="margin-bottom:0;">No shifts defined yet.</div>`; return; }
    el.innerHTML = shifts.map(sh=>`
      <div class="ledger-row">
        <div><strong>${escapeHtml(sh.code)}</strong> &middot; ${escapeHtml(sh.name)}
          <span style="color:var(--muted);font-size:11.5px;">${sh.start}–${sh.end}${shiftLenNote(sh)}</span></div>
        <button class="btn btn-ghost btn-sm" data-rs-del="${sh.id}" style="padding:3px 8px;">Remove</button>
      </div>`).join('');
    el.querySelectorAll('[data-rs-del]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('Remove this shift? Anyone pinned to it will fall back to rotating with their group.')) return;
        const list = (await getRosterShifts()).filter(x=>x.id !== btn.dataset.rsDel);
        await saveRosterShifts(list);
        renderRoster();
      };
    });
  }

  // Shift length, with a note when it differs from the 8h30 standard.
  function shiftLenNote(sh){
    if(!sh.start || !sh.end) return '';
    const [h1,m1] = sh.start.split(':').map(Number);
    const [h2,m2] = sh.end.split(':').map(Number);
    let mins = (h2*60+m2) - (h1*60+m1);
    if(mins <= 0) mins += 24*60; // crosses midnight
    const label = ` &middot; ${Math.floor(mins/60)}h${String(mins%60).padStart(2,'0')}`;
    if(mins === STANDARD_SHIFT_MINUTES) return label;
    const diff = mins - STANDARD_SHIFT_MINUTES;
    return label + ` <span style="color:var(--amber-dark);">(${diff>0?'+':''}${diff}m vs standard)</span>`;
  }

  function drawHolidayList(list){
    const el = document.getElementById('rs-hol-list');
    if(!el) return;
    if(!list || list.length === 0){
      el.innerHTML = `<div class="help" style="margin-bottom:0;">No extra holidays added — only the built-in fixed dates apply.</div>`;
      return;
    }
    const sorted = list.slice().sort((a,b)=> a.date.localeCompare(b.date));
    el.innerHTML = sorted.map(h=>`
      <div class="ledger-row">
        <div class="ledger-note" style="font-size:12.5px;"><span class="mono" style="color:var(--muted);">${h.date}</span> ${escapeHtml(h.name)}</div>
        <button class="btn btn-ghost btn-sm" data-hol-del="${h.date}" style="padding:3px 8px;">Remove</button>
      </div>`).join('');
    el.querySelectorAll('[data-hol-del]').forEach(btn=>{
      btn.onclick = async ()=>{
        const rest = (await getHolidays()).filter(h=>h.date !== btn.dataset.holDel);
        await saveHolidays(rest);
        renderRoster();
      };
    });
  }

  function drawJobRoleList(roles){
    const el = document.getElementById('rs-role-list');
    if(!el) return;
    if(roles.length === 0){ el.innerHTML = `<div class="help" style="margin-bottom:0;">No roles defined yet.</div>`; return; }
    const byCat = {};
    roles.forEach(r=>{ (byCat[r.category || 'Uncategorised'] = byCat[r.category || 'Uncategorised'] || []).push(r); });
    // List order is the roster display order, so it can be arranged to match
    // how the team is actually read out.
    el.innerHTML = roles.map((r,i)=>`
      <div class="ledger-row">
        <div class="ledger-note" style="font-size:12.5px;">
          <span style="color:var(--muted);">${i+1}.</span> ${escapeHtml(r.name)}
          ${r.category ? `<span style="font-size:10.5px;color:var(--muted);">${escapeHtml(r.category)}</span>` : ''}
        </div>
        <div style="display:flex;gap:4px;">
          <button class="btn btn-ghost btn-sm" data-rs-role-up="${r.id}" style="padding:3px 7px;" ${i===0?'disabled':''}>↑</button>
          <button class="btn btn-ghost btn-sm" data-rs-role-dn="${r.id}" style="padding:3px 7px;" ${i===roles.length-1?'disabled':''}>↓</button>
          <button class="btn btn-ghost btn-sm" data-rs-role-del="${r.id}" style="padding:3px 8px;">Remove</button>
        </div>
      </div>`).join('');
    const moveRole = async (id, delta)=>{
      const list = await getJobRoles();
      const i = list.findIndex(x=>x.id === id);
      const j = i + delta;
      if(i === -1 || j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]];
      await saveJobRoles(list);
      renderRoster();
    };
    el.querySelectorAll('[data-rs-role-up]').forEach(b=>{ b.onclick = ()=> moveRole(b.dataset.rsRoleUp, -1); });
    el.querySelectorAll('[data-rs-role-dn]').forEach(b=>{ b.onclick = ()=> moveRole(b.dataset.rsRoleDn, 1); });
    el.querySelectorAll('[data-rs-role-del]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('Remove this role? Anyone assigned to it will show as unassigned.')) return;
        const list = (await getJobRoles()).filter(x=>x.id !== btn.dataset.rsRoleDel);
        await saveJobRoles(list);
        renderRoster();
      };
    });
  }

  // Google-style month grid: 7 columns, one cell per day. Tapping a day opens
  // an editor for that week — rotation is weekly, so a change applies to the
  // whole week rather than a single day.
  function drawRosterCalendar(rostered, shifts, cfg, jobRoles, overrides, customHols){
    const el = document.getElementById('rs-calendar');
    if(!el) return;
    const [y, m] = rosterMonth.split('-').map(Number);
    const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const firstMonday = mondayOf(`${rosterMonth}-01`);
    const today = todayStr();
    const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

    const years = [String(y-1), String(y), String(y+1)];
    const hols = holidayMapFor(years, customHols);
    const cells = [];
    let cur = firstMonday;
    const lastDay = `${rosterMonth}-${String(daysInMonth).padStart(2,'0')}`;
    while(cur <= lastDay || cells.length % 7 !== 0){
      cells.push(cur);
      const nx = new Date(cur + 'T12:00:00Z');
      nx.setUTCDate(nx.getUTCDate() + 1);
      cur = nx.toISOString().slice(0,10);
      if(cells.length > 42) break;
    }

    el.innerHTML = `
      <div class="cal-scroll">
        <div class="cal-grid">
          ${dayNames.map(d=>`<div class="cal-head">${d}</div>`).join('')}
          ${cells.map(d=>{
            const inMonth = d.startsWith(rosterMonth);
            // Date only — tap a day for the full breakdown.
            const hol = hols[d];
            return `<div class="cal-cell${inMonth?'':' muted'}${d===today?' today':''}${hol?' holiday':''}" ${inMonth?`data-cal-day="${d}"`:''} ${hol?`title="${escapeHtml(hol.name)}"`:''}>
              <div class="cal-date">${Number(d.slice(8))}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div id="rs-day-panel" style="margin-top:12px;"></div>
    `;

    el.querySelectorAll('[data-cal-day]').forEach(cell=>{
      cell.onclick = ()=> drawDayPanel(cell.dataset.calDay, rostered, shifts, cfg, jobRoles, overrides, hols);
    });
  }

  function firstName(n){ return String(n||'').trim().split(/\s+/)[0] || ''; }
  // Worker-facing month roster. Standalone so it can be opened from the
  // worker menu without going through the clock screen first.
  async function renderWorkerRoster(body, worker, onBack){
    let ym = todayStr().slice(0,7);
    const draw = async ()=>{
      body.innerHTML = `<div class="empty">Loading…</div>`;
      const [shifts, cfg, allW, ovThis, ovPrev, ovNext, customHols] = await Promise.all([
        getRosterShifts(), getRosterConfig(), getWorkers(),
        getRosterOverrides(ym), getRosterOverrides(shiftMonth(ym, -1)), getRosterOverrides(shiftMonth(ym, 1)),
        getHolidays()
      ]);
      const ovs = Object.assign({}, ovPrev, ovThis, ovNext);
      const me = allW.find(x=>x.id === worker.id) || worker;
      const yNum = Number(ym.slice(0,4));
      const hols = holidayMapFor([String(yNum-1), String(yNum), String(yNum+1)], customHols);
      const [yy, mm] = ym.split('-').map(Number);
      const dim = new Date(Date.UTC(yy, mm, 0)).getUTCDate();
      const cells = [];
      let c = mondayOf(`${ym}-01`);
      const last = `${ym}-${String(dim).padStart(2,'0')}`;
      while(c <= last || cells.length % 7 !== 0){
        cells.push(c);
        const n = new Date(c + 'T12:00:00Z'); n.setUTCDate(n.getUTCDate()+1);
        c = n.toISOString().slice(0,10);
        if(cells.length > 42) break;
      }
      const tod = todayStr();
      body.innerHTML = `
        <a class="backlink" href="#" id="wr-back">&lsaquo; Back</a>
        <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px;">
          <strong style="font-size:15px;">${monthLabel(ym)}</strong>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-ghost btn-sm" id="wr-prev" style="padding:3px 10px;">&lsaquo;</button>
            <button class="btn btn-ghost btn-sm" id="wr-next" style="padding:3px 10px;">&rsaquo;</button>
          </div>
        </div>
        <div class="cal-scroll"><div class="cal-grid">
          ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-head">${d}</div>`).join('')}
          ${cells.map(d=>{
            const inM = d.startsWith(ym);
            const hol = hols[d];
            return `<div class="cal-cell${inM?'':' muted'}${d===tod?' today':''}${hol?' holiday':''}" ${inM?`data-wr-day="${d}"`:''} ${hol?`title="${escapeHtml(hol.name)}"`:''}>
              <div class="cal-date">${Number(d.slice(8))}</div>
            </div>`;
          }).join('')}
        </div></div>
        <div id="wr-detail" style="margin-top:12px;"></div>
      `;
      document.getElementById('wr-back').onclick = (e)=>{ e.preventDefault(); onBack(); };
      document.getElementById('wr-prev').onclick = ()=>{ ym = shiftMonth(ym, -1); draw(); };
      document.getElementById('wr-next').onclick = ()=>{ ym = shiftMonth(ym, 1); draw(); };
      body.querySelectorAll('[data-wr-day]').forEach(cell=>{
        cell.onclick = ()=>{
          const d = cell.dataset.wrDay;
          const sh = shiftForWorkerOn(me, d, cfg, shifts, allW, ovs);
          const grp = groupForWorkerOn(me, d, cfg);
          document.getElementById('wr-detail').innerHTML = `
            <div style="padding:14px;background:var(--paper);border-radius:10px;">
              <div style="font-size:12.5px;font-weight:700;color:var(--ink);">${dayLabel(d)}</div>
              ${hols[d] ? `<div style="font-size:11.5px;color:var(--red);font-weight:600;margin-top:2px;">🇲🇾 ${escapeHtml(hols[d].name)}</div>` : ''}
              ${!sh
                ? `<div style="font-size:13px;color:var(--muted);margin-top:8px;">No shift set</div>`
                : sh.id === 'OFF'
                  ? `<div style="font-size:17px;font-weight:700;color:var(--amber-dark);margin-top:8px;">Rest day</div>`
                  : `<div style="font-size:17px;font-weight:700;color:var(--ink);margin-top:8px;">${escapeHtml(sh.name)}</div>
                     <div style="font-size:14px;color:var(--ink);margin-top:2px;">${sh.start} – ${sh.end}</div>`}
              <div style="font-size:11.5px;color:var(--muted);margin-top:8px;">Group ${grp}</div>
            </div>`;
        };
      });
    };
    await draw();
  }

  function dayLabel(dateStr){
    return new Date(dateStr + 'T12:00:00Z').toLocaleDateString(undefined,
      { weekday:'long', day:'numeric', month:'short', year:'numeric', timeZone:'UTC' });
  }

  // Editor for the week containing dateStr. Saving writes an override, which
  // takes priority over the partner rotation from then on.
  function drawDayPanel(dateStr, rostered, shifts, cfg, jobRoles, overrides, hols){
    const panel = document.getElementById('rs-day-panel');
    if(!panel) return;
    // Laid out the way the team is read out: Group A, then Group B, with
    // roles in the order set on the Job roles card. Anyone without a role
    // falls to the bottom of their group rather than disappearing.
    const groupBlock = (label, members) => {
      if(members.length === 0) return '';
      const ordered = [];
      (jobRoles||[]).forEach(r=>{
        const inRole = members.filter(w=>w.jobRoleId === r.id);
        if(inRole.length) ordered.push({ roleName: r.name, people: inRole });
      });
      const noRole = members.filter(w=>!w.jobRoleId || !(jobRoles||[]).some(r=>r.id === w.jobRoleId));
      if(noRole.length) ordered.push({ roleName: 'No role set', people: noRole });

      return `
        <div class="eyebrow" style="margin:12px 0 4px;">${label}</div>
        ${ordered.map(sec=>`
          <div style="padding:7px 0;border-top:1px solid var(--line);">
            <div style="font-size:11px;font-weight:700;color:var(--ink);margin-bottom:4px;">${escapeHtml(sec.roleName)}</div>
            ${sec.people.map(w=>{
              const key = overrideKey(w.id, dateStr);
              const ovVal = overrides[key] || '';
              const auto = shiftForWorkerOn({...w}, dateStr, cfg, shifts, rostered, {});
              return `
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;">
                <div style="font-size:12.5px;">
                  ${escapeHtml(w.name)}
                  <span style="font-size:10px;color:${w.partnerId ? 'var(--green)' : 'var(--muted)'};">${w.partnerId ? 'rotates' : 'fixed'}</span>
                  ${auto && auto.id === 'OFF' ? `<span style="font-size:10px;color:var(--amber-dark);">rest day</span>` : ''}
                </div>
                <select data-ov="${w.id}" style="max-width:165px;font-size:12px;">
                  <option value="">Follow rotation${auto ? ' (' + auto.code + ')' : ''}</option>
                  ${shifts.map(sh=>`<option value="${sh.id}" ${ovVal===sh.id?'selected':''}>${escapeHtml(sh.code)} · ${sh.start}–${sh.end}</option>`).join('')}
                  <option value="OFF" ${ovVal==='OFF'?'selected':''}>Off / rest day</option>
                </select>
              </div>`;
            }).join('')}
          </div>`).join('')}`;
    };

    panel.innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <strong style="font-size:13.5px;">${dayLabel(dateStr)}${hols && hols[dateStr] ? `<br><span style="color:var(--red);font-size:11.5px;">🇲🇾 ${escapeHtml(hols[dateStr].name)}</span>` : ''}</strong>
          <button class="btn btn-ghost btn-sm" id="rs-day-close" style="padding:3px 9px;">Close</button>
        </div>
        <div class="help">Changes apply to this date only. "Follow rotation" restores the normal pattern, including the usual rest day.</div>
        ${groupBlock('Group A', rostered.filter(w=>groupForWorkerOn(w, dateStr, cfg) === 'A'))}
        ${groupBlock('Group B', rostered.filter(w=>groupForWorkerOn(w, dateStr, cfg) === 'B'))}
        <button class="btn btn-primary btn-block" id="rs-day-save" style="margin-top:12px;">Save this date</button>
        <div id="rs-day-msg" style="margin-top:8px;font-size:12.5px;"></div>
      </div>`;

    document.getElementById('rs-day-close').onclick = ()=>{ panel.innerHTML = ''; };
    document.getElementById('rs-day-save').onclick = async function(){
      this.disabled = true; this.textContent = 'Saving…';
      const ym = dateStr.slice(0,7);
      const map = await getRosterOverrides(ym);
      panel.querySelectorAll('[data-ov]').forEach(sel=>{
        const k = sel.dataset.ov + '|' + dateStr;
        if(sel.value) map[k] = sel.value; else delete map[k];
      });
      const ok = await saveRosterOverrides(ym, map);
      this.disabled = false; this.textContent = 'Save this date';
      if(ok) renderRoster();
      else {
        const m2 = document.getElementById('rs-day-msg');
        m2.style.color = 'var(--red)'; m2.textContent = 'Could not save — try again.';
      }
    };
  }

  async function renderLog(viewDate){
    const el = document.getElementById('view-log');
    el.innerHTML = `<div class="empty">Loading log…</div>`;
    const dateStr = viewDate || shiftDateStr();
    const log = await getLogForDate(dateStr);

    el.innerHTML = `
      <div class="log-controls">
        <div class="field" style="margin:0;min-width:150px;">
          <label style="font-size:11px;">Date</label>
          <input type="date" id="l-date" value="${dateStr}">
        </div>
        <button class="btn btn-amber btn-sm" id="l-export">Export CSV</button>
      </div>
      <div class="help" style="margin-bottom:10px;">Showing ${log.length} record${log.length===1?'':'s'} for ${dateStr}. Pick another date to view it — only that day is loaded.</div>
      <div id="l-table"></div>
    `;
    document.getElementById('l-date').onchange = (ev)=>{
      if(ev.target.value) renderLog(ev.target.value);
    };

    // 50 rows at a time — the whole log is already in memory, so paging only
    // limits what gets drawn. Each row can carry a selfie thumbnail, which is
    // what makes rendering the full list slow.
    const LOG_PAGE = 50;
    function draw(page){
      page = page || 0;
      const sorted = log.slice().sort((a,b)=> b.ts.localeCompare(a.ts));
      const tbl = document.getElementById('l-table');
      if(sorted.length === 0){
        tbl.innerHTML = `<div class="empty">No clock records for ${dateStr}.</div>`;
        return;
      }
      const pages = Math.ceil(sorted.length / LOG_PAGE);
      if(page > pages - 1) page = pages - 1;
      const pageRows = sorted.slice(page*LOG_PAGE, (page+1)*LOG_PAGE);
      const from = page*LOG_PAGE + 1, to = Math.min(sorted.length, (page+1)*LOG_PAGE);
      tbl.innerHTML = `
        <table class="logtable">
          <thead><tr><th>Photo</th><th>Name</th><th>Type</th><th>Date</th><th>Time</th><th>Location</th><th>Dist.</th><th></th></tr></thead>
          <tbody>
            ${pageRows.map((e,i)=>{
              const d = new Date(e.ts);
              const photoCell = e.photoUrl
                ? `<img class="log-photo" data-idx="${i}" src="${e.photoUrl}" style="width:36px;height:36px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;">`
                : `<span style="color:var(--muted);font-size:11px;">—</span>`;
              const flagCell = e.flagged
                ? `<span title="${escapeHtml(e.flagReason||'')}" style="color:var(--red);font-weight:600;font-size:13px;">⚠</span>`
                : '';
              return `<tr${e.flagged ? ' style="background:rgba(220,38,38,0.06);"' : ''}>
                <td>${photoCell}</td>
                <td>${escapeHtml(e.name)}</td>
                <td><span class="pill pill-${e.type}">${e.type}</span></td>
                <td class="mono">${e.date}</td>
                <td class="mono">${fmtTime(d)}</td>
                <td>${e.location ? escapeHtml(e.location) : '<span style="color:var(--muted);font-size:11px;">—</span>'}</td>
                <td class="mono">${e.distanceM}m</td>
                <td>${flagCell}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        ${pages > 1 ? `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;">
          <button class="btn btn-ghost btn-sm" id="l-prev" ${page === 0 ? 'disabled' : ''}>&lsaquo; Prev</button>
          <span style="font-size:11.5px;color:var(--muted);">${from}–${to} of ${sorted.length} &middot; page ${page+1} of ${pages}</span>
          <button class="btn btn-ghost btn-sm" id="l-next" ${page >= pages-1 ? 'disabled' : ''}>Next &rsaquo;</button>
        </div>` : ''}
      `;
      // Photo indices refer to the current page slice, not the whole list.
      tbl.querySelectorAll('.log-photo').forEach(img => {
        img.onclick = () => openPhotoModal(pageRows[parseInt(img.dataset.idx, 10)]);
      });
      const prevBtn = document.getElementById('l-prev');
      const nextBtn = document.getElementById('l-next');
      if(prevBtn) prevBtn.onclick = ()=> draw(page - 1);
      if(nextBtn) nextBtn.onclick = ()=> draw(page + 1);
    }
    draw(0);
    document.getElementById('l-export').onclick = async function(){
      // Default to the day on screen; offer the full history explicitly so a
      // partial export is never a surprise.
      const wantAll = confirm(`Export the FULL history?\n\nOK = every record ever (slower)\nCancel = just ${dateStr}`);
      const btn = this;
      let rows = log;
      if(wantAll){
        btn.disabled = true; btn.textContent = 'Loading full history…';
        rows = await getLog();
        btn.disabled = false; btn.textContent = 'Export CSV';
      }
      exportCsv(rows);
    };
  }

  function openPhotoModal(entry){
    let overlay = document.getElementById('photo-modal');
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'photo-modal';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,33,61,0.82);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;';
      overlay.innerHTML = `
        <div style="background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;text-align:center;" onclick="event.stopPropagation()">
          <img id="photo-modal-img" style="width:100%;border-radius:10px;display:block;">
          <div id="photo-modal-caption" style="margin-top:12px;font-family:'Inter',sans-serif;font-size:13px;color:#1B2333;"></div>
          <button id="photo-modal-close" class="btn btn-ghost" style="margin-top:14px;width:auto;padding:8px 20px;">Close</button>
        </div>`;
      document.body.appendChild(overlay);
      overlay.onclick = () => overlay.style.display = 'none';
      overlay.querySelector('#photo-modal-close').onclick = () => overlay.style.display = 'none';
    }
    overlay.querySelector('#photo-modal-img').src = entry.photoUrl;
    const d = new Date(entry.ts);
    overlay.querySelector('#photo-modal-caption').textContent =
      `${entry.name} · ${entry.type === 'in' ? 'Clocked In' : 'Clocked Out'} · ${entry.date} ${fmtTime(d)}${entry.flagged ? ' · ⚠ ' + entry.flagReason : ''}`;
    overlay.style.display = 'flex';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Groups raw log entries by name+date into one row per person per day,
  // with clock-in/out paired up and hours/minutes/status computed. Shared by
  // the CSV export and the Reports tab so the numbers always agree.
  function groupEntriesByNameDate(rows){
    const groups = {};
    rows.forEach(e=>{
      const key = (e.workerId || e.name) + '||' + e.date;
      if(!groups[key]){
        groups[key] = { name: e.name, workerId: e.workerId || null, date: e.date, clockIn: null, clockOut: null, flagged: false, flagReasons: [] };
      }
      const g = groups[key];
      if(e.type === 'in'){
        if(!g.clockIn || e.ts < g.clockIn.ts) g.clockIn = e;
      } else {
        if(!g.clockOut || e.ts > g.clockOut.ts) g.clockOut = e;
      }
      if(e.flagged){
        g.flagged = true;
        if(e.flagReason) g.flagReasons.push(e.flagReason);
      }
    });
    return Object.values(groups).map(g=>{
      const inTime = g.clockIn ? fmtTime(new Date(g.clockIn.ts)) : '';
      const outTime = g.clockOut ? fmtTime(new Date(g.clockOut.ts)) : '';
      let hours = '', minutes = '', status = '', worked = null, shortBy = 0;
      if(g.clockIn && g.clockOut){
        const diffMs = new Date(g.clockOut.ts) - new Date(g.clockIn.ts);
        if(diffMs >= 0){
          const totalMinutes = Math.round(diffMs / 60000);
          hours = Math.floor(totalMinutes / 60);
          minutes = totalMinutes % 60;
          status = 'Complete';
          worked = totalMinutes;
          shortBy = Math.max(0, STANDARD_SHIFT_MINUTES - totalMinutes);
        } else {
          status = 'Clock-out before clock-in';
        }
      } else if(g.clockIn && !g.clockOut){
        status = 'Missing clock-out';
      } else if(!g.clockIn && g.clockOut){
        status = 'Missing clock-in';
      }
      return { ...g, inTime, outTime, hours, minutes, status, worked, shortBy };
    });
  }

  function exportCsv(rows){
    const grouped = groupEntriesByNameDate(rows);
    const header = ['Name','Date','Clock In','Clock Out','Hours','Minutes','Status','Flagged','Flag Reason'];
    const lines = [header.join(',')];

    grouped
      .sort((a,b)=> a.date === b.date ? a.name.localeCompare(b.name) : b.date.localeCompare(a.date))
      .forEach(g=>{
        const line = [
          '"'+g.name.replace(/"/g,'""')+'"',
          g.date,
          g.inTime,
          g.outTime,
          g.hours,
          g.minutes,
          g.status,
          g.flagged ? 'YES' : '',
          '"'+g.flagReasons.join('; ').replace(/"/g,'""')+'"'
        ].join(',');
        lines.push(line);
      });

    const blob = new Blob(['\ufeff' + lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'attendance_log_' + todayStr() + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

})();
</script>
</body>
</html>
